name: daily patch

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-patch
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 生成补丁模块
        run: python patch/autopatch.py

      - name: 有变化才提交
        run: |
          set -e
          echo "--- git status ---"
          git status --short
          echo "--- out 目录 ---"
          ls -la out/ || echo "no out dir"
          git add -A
          echo "--- 暂存后 ---"
          git status --short
          if git diff --cached --quiet; then
            echo "upstream unchanged"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: rebuild $(date -u +%Y-%m-%d)"
          git push
